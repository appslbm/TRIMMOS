# Publica o site no GitHub Pages a cada push na main.
# Antes do primeiro deploy: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# O endereço é calculado a partir do repositório onde o workflow roda:
#   appslbm/TRIMMOS          → https://appslbm.github.io/TRIMMOS/          (site oficial)
#   appslbm/TRIMMOS-preview  → https://appslbm.github.io/TRIMMOS-preview/  (demonstração, com noindex)
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLIENT: trimmos
          DEPLOY_SITE: https://${{ github.repository_owner }}.github.io
          DEPLOY_BASE: /${{ github.event.repository.name }}
          # Qualquer repositório que não seja o oficial é tratado como demonstração (noindex).
          PREVIEW: ${{ github.repository != 'appslbm/TRIMMOS' }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
